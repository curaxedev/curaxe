# Deploy API (Laravel) su Hostinger via SSH
# Secrets: DEPLOY_SSH_HOST, DEPLOY_SSH_USER, DEPLOY_SSH_KEY, DEPLOY_API_PATH
# Opzionale: environment "production" con required reviewers.

name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'federicoandreoli-api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api-production
  cancel-in-progress: false

jobs:
  test:
    name: Test API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: federicoandreoli-api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Prepare env
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force
      - run: php artisan test

  deploy:
    name: Deploy via SSH
    needs: test
    runs-on: ubuntu-latest
    # environment: production   # decommenta dopo aver creato Environment su GitHub
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Require deploy secrets
        env:
          HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          USER: ${{ secrets.DEPLOY_SSH_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          PATH_API: ${{ secrets.DEPLOY_API_PATH }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$KEY" ] || [ -z "$PATH_API" ]; then
            echo "Secrets DEPLOY_SSH_* / DEPLOY_API_PATH non configurati. Vedi docs/GITHUB-DEPLOY-SECURE.md"
            exit 1
          fi

      - name: Start ssh-agent and add key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          USER: ${{ secrets.DEPLOY_SSH_USER }}
          PATH_API: ${{ secrets.DEPLOY_API_PATH }}
        run: |
          set -euo pipefail
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -o StrictHostKeyChecking=accept-new "${USER}@${HOST}" bash -s <<EOF
          set -euo pipefail
          cd "${PATH_API}"
          git fetch --prune origin
          git checkout main
          git pull --ff-only origin main
          composer install --no-dev --optimize-autoloader --no-interaction
          php artisan migrate --force
          php artisan storage:link || true
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan queue:restart || true
          echo "API deploy OK \$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          EOF
