# Build React/Vite e deploy artifact su Hostinger. Configurare secrets (FTP/SFTP/SSH).

name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build
        env:
          VITE_SITE_ORIGIN: https://federico.backsoftware.it
          VITE_API_URL: https://apifedericoandreoli.backsoftware.it

      # Esempio: SamKirkland/FTP-Deploy-Action per hosting con FTP
      # - name: FTP deploy
      #   uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      #   with:
      #     server: ${{ secrets.FTP_SERVER }}
      #     username: ${{ secrets.FTP_USERNAME }}
      #     password: ${{ secrets.FTP_PASSWORD }}
      #     local-dir: ./dist/
      #     server-dir: /public_html/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
