# Deploy su Hostinger (API Laravel). Configurare secrets nel repo GitHub.
# Esempi: SSH_HOST, SSH_USER, SSH_KEY, REMOTE_PATH (directory del progetto sul server)

name: Deploy API

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, json, bcmath, pdo, pdo_mysql, pdo_pgsql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Run tests
        run: php artisan test
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      # Esempio deploy SSH (decommentare e adattare a Hostinger VPS / SSH)
